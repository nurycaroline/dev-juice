# Publishes the Dev Juice extension to the VS Code Marketplace on every push
# to main. The publish is idempotent: if the version in package.json is already
# on the store, the publish step is skipped (so doc-only pushes don't fail).
#
# Setup required (one-time):
#   1. Create a Personal Access Token (PAT) for the publisher that owns this
#      extension on the Marketplace:
#        https://dev.azure.com/<user-or-org>/_usersSettings/tokens
#      Scope: "Custom defined" > Marketplace > "Publish" (Acquire).
#      The PAT must belong to the same account that owns the `NuryStudio`
#      publisher in package.json.
#   2. Add it as a repository secret named `VSCE_PAT`:
#        https://github.com/nurycaroline/dev-juice/settings/secrets/actions
#   3. Bump `version` in package.json before merging a release to main; the
#      Marketplace rejects re-publishing an existing version, and this workflow
#      skips publish when the version is already on the store.
#
# `@vscode/vsce` reads the PAT from the VSCE_PAT environment variable, so the
# secret never needs to be passed on the command line.

name: Publish Extension

on:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same branch to keep publish ordering clear.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # VS Code's test runner launches a real editor instance, which on a
      # headless Linux runner requires an X server. xvfb-run is preinstalled
      # on ubuntu-latest; the guard installs it only if it is missing.
      - name: Ensure xvfb is available
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Test
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-juice-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14

      - name: Check if version needs publishing
        id: check
        run: node .github/scripts/should-publish.mjs

      - name: Publish to Marketplace
        if: steps.check.outputs.should-publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT repository secret is not set — skipping publish. See .github/workflows/publish.yml header for setup instructions."
            exit 0
          fi
          npm run deploy
