# Publishes the Dev Juice extension to both the VS Code Marketplace and the
# Open VSX Registry on every push to main. Open VSX is the registry Cursor
# (and other VS Code forks) use, so publishing there is what makes the
# extension installable from Cursor's Extensions panel.
#
# The publish is idempotent: if the version in package.json is already on a
# given store, that store's publish step is skipped (so doc-only pushes don't
# fail). The two stores are gated independently — see should-publish.mjs.
#
# Setup required (one-time):
#   1. VS Code Marketplace PAT — for the `NuryStudio` publisher in package.json:
#        https://dev.azure.com/<user-or-org>/_usersSettings/tokens
#      Scope: "Custom defined" > Marketplace > "Publish" (Acquire).
#      Add it as a repository secret named `VSCE_PAT`:
#        https://github.com/nurycaroline/dev-juice/settings/secrets/actions
#
#   2. Open VSX access token — create the `NuryStudio` namespace on Open VSX
#      once (https://open-vsx.org/), then generate a token under Settings →
#      Access Tokens. Add it as a repository secret named `OVSX_PAT`:
#        https://github.com/nurycaroline/dev-juice/settings/secrets/actions
#
#   3. Bump `version` in package.json before merging a release to main; each
#      store rejects re-publishing an existing version, and this workflow
#      skips a store's publish when the version is already on that store.
#
# `@vscode/vsce` reads the Marketplace PAT from VSCE_PAT, and `ovsx` reads the
# Open VSX token from OVSX_PAT, so neither secret needs to be passed on the
# command line.

name: Publish Extension

on:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same branch to keep publish ordering clear.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # VS Code's test runner launches a real editor instance, which on a
      # headless Linux runner requires an X server. xvfb-run is preinstalled
      # on ubuntu-latest; the guard installs it only if it is missing.
      - name: Ensure xvfb is available
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Test
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-juice-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14

      - name: Check which stores need publishing
        id: check
        run: node .github/scripts/should-publish.mjs

      - name: Publish to VS Code Marketplace
        if: steps.check.outputs.should-publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT repository secret is not set — skipping Marketplace publish. See .github/workflows/publish.yml header for setup instructions."
            exit 0
          fi
          npm run deploy

      - name: Publish to Open VSX (Cursor)
        if: steps.check.outputs.should-publish-openvsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT repository secret is not set — skipping Open VSX publish. See .github/workflows/publish.yml header for setup instructions."
            exit 0
          fi
          npm run deploy:openvsx
